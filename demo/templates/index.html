<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FluxCast カメラデモ</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #0b0e14; color: #e6e9ef; display: flex; flex-direction: column;
         align-items: center; min-height: 100vh; }
  header { padding: 20px; text-align: center; }
  h1 { margin: 0 0 4px; font-size: 1.25rem; }
  .sub { color: #8b93a7; font-size: .85rem; }
  .stage { width: min(92vw, 900px); }
  video { width: 100%; background: #000; border-radius: 12px; aspect-ratio: 16 / 9; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between;
         margin-top: 12px; flex-wrap: wrap; }
  .badge { font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: #1b2130; }
  #state { color: #7ee787; }
  button { background: #2f81f7; color: #fff; border: 0; padding: 8px 16px;
           border-radius: 8px; font-size: .9rem; cursor: pointer; }
  .path { margin-top: 14px; font-size: .78rem; color: #8b93a7; line-height: 1.5;
          font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>FluxCast カメラデモ</h1>
  <div class="sub">ローカルのカメラ映像・音声を FluxCast (FCDP/UDP) で受信側へ配送し、HLS で再生しています。</div>
</header>
<div class="stage">
  <video id="video" controls autoplay muted playsinline></video>
  <div class="row">
    <span class="badge">状態: <span id="state">接続待ち…</span></span>
    <button id="unmute">音声をオンにする</button>
  </div>
  <div class="path">
    camera + mic → ffmpeg(H.264/AAC) → fluxcast publish-ts → FCDP/UDP →
    receiver fcdp_ts_receive.py → ffmpeg(HLS, 再エンコードなし) → app.py → このページ
  </div>
</div>
<script src="/static/hls.min.js"></script>
<script>
  const video = document.getElementById('video');
  const state = document.getElementById('state');
  const src = '/hls/stream.m3u8';
  function setState(text, ok) { state.textContent = text; state.style.color = ok ? '#7ee787' : '#e5924b'; }

  document.getElementById('unmute').onclick = () => { video.muted = false; video.play(); };

  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari plays HLS natively.
    video.src = src;
    video.addEventListener('loadeddata', () => setState('再生中 (native HLS)', true));
    video.addEventListener('error', () => setState('ストリーム待ち…', false));
  } else if (window.Hls && Hls.isSupported()) {
    const hls = new Hls({ liveSyncDurationCount: 2, lowLatencyMode: true });
    const attach = () => hls.loadSource(src);
    hls.on(Hls.Events.MEDIA_ATTACHED, attach);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { setState('再生中', true); video.play().catch(() => {}); });
    hls.on(Hls.Events.ERROR, (_e, data) => {
      if (data.fatal) { setState('ストリーム待ち…再試行中', false); setTimeout(attach, 2000); }
    });
    hls.attachMedia(video);
  } else {
    setState('このブラウザは HLS 再生に対応していません', false);
  }
</script>
</body>
</html>
