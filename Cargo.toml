[workspace]
members = ["crates/fluxcast-proto", "crates/fluxcast-core", "crates/fluxcast-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/fluxcast/fluxcast"
homepage = "https://github.com/fluxcast/fluxcast"
keywords = ["media", "udp", "streaming", "low-latency"]
categories = ["network-programming", "multimedia"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
