[workspace]
members = [
  "crates/fcst-protocol",
  "crates/visual-state",
  "crates/renderer",
  "crates/freshness-engine",
  "crates/atom-scheduler",
  "services/edge-gateway",
  "services/session-api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
