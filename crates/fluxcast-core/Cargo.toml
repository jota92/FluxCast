[package]
name = "fluxcast-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deadline-aware media framing, FEC, recovery and UDP transport for FluxCast."
keywords.workspace = true
categories.workspace = true

[dependencies]
fluxcast-proto = { path = "../fluxcast-proto", version = "0.1.0" }
fluxcast-security = { path = "../fluxcast-security", version = "0.1.0" }
rand_core = { version = "0.6", features = ["getrandom"] }
# TURN long-term authentication (RFC 5766/8489): key = MD5(user:realm:pass),
# MESSAGE-INTEGRITY = HMAC-SHA1. Audited RustCrypto crates; no custom crypto.
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"

[lints]
workspace = true
