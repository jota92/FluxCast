[package]
name = "fluxcast-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Authenticated encryption and replay protection primitives for FluxCast."

[dependencies]
chacha20poly1305 = "0.10.1"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
hkdf = "0.12.4"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10.8"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "getrandom"] }
fluxcast-proto = { path = "../fluxcast-proto", version = "0.1.0" }

[lints]
workspace = true
